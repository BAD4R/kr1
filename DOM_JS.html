<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <title>DOM_JS. Считываем информацию из DOM</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <object id="navbar" type="text/html" data="navbar.html" style="width:100%; height: 55px;"></object>
        


        <h2 id="lists">DOM_JS. Считываем информацию из DOM</h2>
        <figure>
            <img src="images/DOM_JS.png" width="1200px" alt="Скриншот экрана браузера">
            <figcaption>Скриншот экрана браузера</figcaption>
        </figure>
        <script>
            const navbar = document.getElementById('navbar');
            const current = location.pathname.split('/').pop() || 'index.html';
            const src = 'navbar.html?current=' + encodeURIComponent(current);
            navbar.data = src;
        </script>
    </body>
</html>
