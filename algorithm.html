<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <title>Алгоритмическая задача</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <object id="navbar" type="text/html" data="navbar.html" style="width:100%; height: 55px;"></object>

        <h2>Алгоритмическая задача</h2>
        <p>1010. Дано число X. Определить, принадлежит ли это число заданному промежутку [a, b].</p>

        <p>
            Число X:
            <input id="numberX" type="number" placeholder="любое число">
            <button id="randomizeX">Randomize</button>
        </p>
        <p>
            Число a:
            <input id="numberA" type="number" placeholder="любое число">
            <button id="randomizeA">Randomize</button>
        </p>
        <p>
            Число b:
            <input id="numberB" type="number" placeholder="любое число">
            <button id="randomizeB">Randomize</button>
        </p>
        <div style="display: inline-flex;">
            <p>Ответ:</p>
            <p id="answer"> Введите все числа</p>
        </div>
        <script src="scripts/js/algorithm.js"></script>
        <script>
            const navbar = document.getElementById('navbar');
            const current = location.pathname.split('/').pop() || 'index.html';
            const src = 'navbar.html?current=' + encodeURIComponent(current);
            navbar.data = src;
        </script>
    </body>
</html>
